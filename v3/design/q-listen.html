<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>听音选义</title><link rel="stylesheet" href="design.css"></head><body><main class="study"><div class="studybar"><button class="x" title="暂停（Esc）">×</button><div class="track"><span style="width:43%"></span></div><span class="small muted num">18 / 42</span></div>
<article class="card"><div class="meta"><span class="tag">听音选义</span><span class="tag core">核心词</span></div>
<div class="listen"><button class="play" title="重听（R）"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button><div><div class="wave"><i style="height:10px"></i><i style="height:18px"></i><i style="height:26px"></i><i style="height:14px"></i><i style="height:22px"></i><i style="height:30px"></i><i style="height:16px"></i><i style="height:24px"></i><i style="height:12px"></i><i style="height:20px"></i><i style="height:28px"></i><i style="height:14px"></i><i style="height:8px"></i></div><div class="small muted">戴上耳机 · 按 R 重听（不限次数）</div></div></div>
<div class="prompt"><div class="q">听到的是哪个意思？</div></div>
<div class="opts"><button class="opt"><span class="k">A</span>adv. 总是, 一直</button><button class="opt"><span class="k">B</span>adv. 已经, 早已</button><button class="opt"><span class="k">C</span>adv. 也, 还</button><button class="opt"><span class="k">D</span>adv. 几乎, 差不多</button></div>
<p class="small muted" style="margin:14px 0 0">没听到声音？检查耳机或音量。</p></article>
<div class="hints"><span><kbd>1</kbd>–<kbd>4</kbd>选项</span><span><kbd>R</kbd>重听</span><span><kbd>Esc</kbd>暂停</span></div></main></body></html>
